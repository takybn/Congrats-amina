<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Congratulations BAC 2026</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    overscroll-behavior:none;
}

/* إزالة تأثير الضغط الأزرق */
button{
    -webkit-tap-highlight-color:transparent;
    outline:none;
}

button:focus,
button:active{
    outline:none;
    box-shadow:none;
}


#video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
    pointer-events:none;
}


/* زر التشغيل المخفي */
#playBtn{

    position:fixed;
    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:150px;
    height:150px;

    background:transparent;
    border:none;

    opacity:0;

    z-index:100;

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}



/* زر الصوت */
#muteBtn{

    position:fixed;

    right:20px;
    bottom:20px;

    width:58px;
    height:58px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(12px);

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:200;

}



#muteBtn svg{

    width:28px;
    height:28px;

    fill:white;

}


</style>

</head>


<body>


<button id="playBtn"></button>


<video
id="video"
playsinline
webkit-playsinline
preload="auto"
disablePictureInPicture
controlsList="nodownload nofullscreen noremoteplayback">

<source src="video.mp4" type="video/mp4">

</video>



<audio id="audio" preload="auto">

<source src="audio.mp3" type="audio/mpeg">

</audio>




<button id="muteBtn">

<svg id="icon" viewBox="0 0 24 24">

<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05A4.48 4.48 0 0016.5 12zm2.5 0c0 3.04-1.72 5.64-4.25 6.92l-.75-1.3A6.99 6.99 0 0017 12a7 7 0 00-2-4.92l.75-1.3C18.28 7.36 20 9.96 20 12z"/>

</svg>

</button>



<script>


const video=document.getElementById("video");
const audio=document.getElementById("audio");
const playBtn=document.getElementById("playBtn");
const muteBtn=document.getElementById("muteBtn");
const icon=document.getElementById("icon");


let started=false;



async function start(){

    if(started) return;

    started=true;


    video.currentTime=0;
    audio.currentTime=0;


    try{

        await video.play();
        await audio.play();

        playBtn.style.display="none";

    }

    catch(e){

        console.log(e);
        started=false;

    }

}



playBtn.addEventListener("click",start);

playBtn.addEventListener("touchstart",start,{passive:true});



video.addEventListener("ended",()=>{

    video.pause();

});




muteBtn.onclick=function(){

    audio.muted=!audio.muted;


    if(audio.muted){

        icon.innerHTML=`

        <path d="M16.5 12c0-1.77-1-3.29-2.5-4.03v2.14l2.28 2.28c.14-.12.22-.24.22-.39zm3.27 8L4 4 2.73 5.27 7 9.54V15h4l5 5v-5.46l2.73 2.73L19.77 20z"/>

        `;

    }

    else{

        icon.innerHTML=`

        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05A4.48 4.48 0 0016.5 12zm2.5 0c0 3.04-1.72 5.64-4.25 6.92l-.75-1.3A6.99 6.99 0 0017 12a7 7 0 00-2-4.92l.75-1.3C18.28 7.36 20 9.96 20 12z"/>

        `;

    }

};

</script>


</body>
</html>
